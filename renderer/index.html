<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>가먼트 프린터</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>가먼트 프린터</h1>
      <div class="head-right">
        <span id="conn" class="chip">확인 중</span>
        <span class="version" id="version"></span>
      </div>
    </header>

    <main>
      <!-- 인증 전 -->
      <section class="card" id="auth-card" hidden>
        <h2>스토어 연결</h2>
        <p>이 단말을 어느 스토어에 연결할지 정합니다. 확인 버튼을 누르면 브라우저가 열리고, 관리자 승인 후 연결됩니다.</p>
        <div class="row">
          <input id="tenant" type="text" placeholder="스토어 주소 (예: spao-seongsu)" autocomplete="off" />
          <button class="primary" id="auth-start">연결하기</button>
        </div>
        <div id="auth-status" class="status"></div>
      </section>

      <!-- 인증 후 -->
      <section class="card" id="run-card" hidden>
        <h2>출력 대기</h2>
        <p id="run-desc">서버에서 출력할 건을 가져옵니다.</p>
        <div class="row">
          <button class="primary" id="agent-toggle">시작</button>
          <span id="agent-state" class="status"></span>
        </div>
        <div id="queue" class="queue"></div>
      </section>

      <section class="card">
        <h2>설정</h2>
        <div class="settings">
          <label class="check"><input type="checkbox" id="garment-enabled" /> 디자인을 장비로 보낸다</label>
          <label class="check"><input type="checkbox" id="work-order-enabled" /> 작업지시서를 인쇄한다</label>
          <label class="field">
            <span>작업지시서 프린터</span>
            <select id="work-order-printer"></select>
          </label>
        </div>
        <div class="row">
          <button class="secondary" id="reauth">다른 스토어로 연결</button>
        </div>
      </section>

      <section class="card">
        <h2>업데이트</h2>
        <p>
          앱을 켤 때 새 버전을 한 번 확인합니다. 출력 도중 재시작을 피하려고 주기적으로 확인하지는 않으니, 필요하면 아래
          버튼으로 직접 확인하세요.
        </p>
        <div class="row">
          <button class="secondary" id="check">업데이트 확인</button>
          <button class="primary" id="install" hidden>재시작하고 적용</button>
        </div>
        <div id="update-status" class="status"></div>
      </section>

      <section class="card">
        <h2>로그</h2>
        <div id="log" class="log"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
