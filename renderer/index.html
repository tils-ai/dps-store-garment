<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>가먼트 프린터</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --border: #e2e5eb;
        --text: #171a1f;
        --text-sub: #444a54;
        --text-muted: #6b717c;
        --accent: #2d6cdf;
        --accent-hover: #1f58c0;
        --neutral: #e7eaf0;
        --neutral-hover: #dadfe8;
        --success: #1e9e54;
        --danger: #d62e2e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
        font-size: 14px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }
      .version {
        color: var(--text-muted);
        font-size: 12px;
      }
      main {
        padding: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        max-width: 560px;
      }
      .card h2 {
        margin: 0 0 4px;
        font-size: 15px;
      }
      .card p {
        margin: 0;
        color: var(--text-sub);
        line-height: 1.7;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .primary {
        background: var(--accent);
        color: #fff;
      }
      .primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .secondary {
        background: var(--neutral);
        color: var(--text);
      }
      .secondary:hover:not(:disabled) {
        background: var(--neutral-hover);
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        color: var(--text-muted);
        min-height: 20px;
      }
      #status.ok {
        color: var(--success);
        font-weight: 600;
      }
      #status.err {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>가먼트 프린터</h1>
      <span class="version" id="version"></span>
    </header>

    <main>
      <div class="card">
        <h2>업데이트</h2>
        <p>
          앱을 켤 때 새 버전을 한 번 확인합니다. 출력 도중 재시작을 피하려고 주기적으로 확인하지는 않으니, 필요하면 아래
          버튼으로 직접 확인하세요.
        </p>

        <div class="row">
          <button class="secondary" id="check">업데이트 확인</button>
          <button class="primary" id="install" hidden>재시작하고 적용</button>
        </div>
        <div id="status"></div>
      </div>
    </main>

    <script>
      const $status = document.getElementById("status");
      const $check = document.getElementById("check");
      const $install = document.getElementById("install");

      window.garment.getVersion().then((v) => {
        document.getElementById("version").textContent = "v" + v;
      });

      function render(state) {
        $install.hidden = state.status !== "ready";
        $check.disabled = state.status === "checking" || state.status === "downloading";
        $status.className = "";

        switch (state.status) {
          case "checking":
            $status.textContent = "확인 중...";
            break;
          case "available":
            $status.textContent = "새 버전 " + state.version + " 을 받는 중입니다.";
            break;
          case "downloading":
            $status.textContent = "받는 중... " + state.percent + "%";
            break;
          case "ready":
            $status.textContent = "새 버전 " + state.version + " 준비됨. 재시작하면 적용됩니다.";
            $status.className = "ok";
            break;
          case "latest":
            $status.textContent = "최신 버전입니다.";
            break;
          case "error":
            $status.textContent = state.message;
            $status.className = "err";
            break;
          default:
            $status.textContent = "";
        }
      }

      window.garment.update.onState(render);
      window.garment.update.state().then(render);

      $check.addEventListener("click", () => window.garment.update.check().then(render));
      $install.addEventListener("click", () => window.garment.update.install());
    </script>
  </body>
</html>
