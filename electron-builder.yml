appId: shop.dpl.store.garment
productName: DPS Garment Printer
directories:
  output: release
files:
  - dist/**
  - renderer/**
  - package.json
  # 복원된 벤더 자산을 asar 안 vendor/ 로 넣는다.
  # extraResources 로 넣으면 설치 폴더에 파일이 그대로 드러난다.
  - from: .vendor-build
    to: vendor
    filter: ["**/*"]
win:
  target: nsis
# 벤더 실행 파일을 asar 밖으로 풀어야 child_process 로 부를 수 있다.
# 이름은 그대로라 설치 폴더에서 곧바로 눈에 띄지는 않는다.
asarUnpack:
  - vendor/**
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: tils-ai
  repo: dps-store-garment
  # electron-builder 는 GitHub 릴리즈를 기본 draft 로 만든다(=수동 Publish 필요).
  # draft 는 electron-updater 가 보지 못해 자동 업데이트가 조용히 멈춘다.
  # dps-store-desktop 에서 겪은 함정이라 release 로 고정한다.
  releaseType: release
