name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # 네이티브 모듈 리빌드가 최신 이미지의 VS 버전을 타는 일이 있어 고정한다
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@a0ea98b2dc7d387a59324835f7421c1d5f8357b4 # v6.0.5
        with:
          version: 11

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # pnpm 11 은 Node 22.13 이상을 요구한다 (node:sqlite 사용)
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 벤더 원본 라이브러리 이름은 레포에 두지 않는다. secret 으로만 들어온다.
      # secret 이 없으면 실행 파일만 복원되고 장비 전송 기능이 빠진 빌드가 나온다.
      - name: Restore vendor manifest
        env:
          VENDOR_DLL_MANIFEST: ${{ secrets.VENDOR_DLL_MANIFEST }}
        shell: bash
        run: |
          if [ -n "$VENDOR_DLL_MANIFEST" ]; then
            printf '%s' "$VENDOR_DLL_MANIFEST" > vendor/.dll_manifest
            echo "매니페스트 주입됨"
          else
            echo "::warning::VENDOR_DLL_MANIFEST 가 없습니다 — 장비 전송 기능이 빠진 빌드가 나옵니다."
          fi

      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release
